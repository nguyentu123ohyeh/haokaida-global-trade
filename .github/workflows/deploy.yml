name: Deploy to GitHub Pages

on:
  push:
    branches: "main" # Hoặc "master" tùy theo tên branch của đại ca

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỗ này cực quan trọng: Vite build ra đâu thì trỏ vào đó
          # Dựa theo log nãy là dist/client hoặc chỉ là dist
          path: dist/client

      - name: Deploy
        uses: actions/deploy-pages@v4